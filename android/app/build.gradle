plugins {
    id 'com.android.application'
}

android {
    namespace 'com.studymind.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.studymind.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}

// Verification task ensuring web assets are present before Gradle APK compilation
tasks.register('checkWebAssets') {
    doLast {
        File indexHtml = file("src/main/assets/index.html")
        File assetsDir = file("src/main/assets/assets")
        if (!indexHtml.exists() || !assetsDir.exists()) {
            throw new GradleException("Missing web assets! Please run 'npm run build:android' so dist files are synced to android/app/src/main/assets.")
        } else {
            println("Verification passed: Web assets (index.html, JS, CSS) packaged in android/app/src/main/assets/")
        }
    }
}

tasks.matching { it.name.startsWith("assemble") || it.name.startsWith("bundle") }.configureEach {
    dependsOn 'checkWebAssets'
}
