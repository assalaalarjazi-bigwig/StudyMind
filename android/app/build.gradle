plugins {
    id 'com.android.application'
}

android {
    namespace 'com.studymind.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.studymind.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}

// Verification task ensuring web assets directory is initialized before compilation
tasks.register('checkWebAssets') {
    doLast {
        File assetsFolder = file("src/main/assets")
        File indexHtml = file("src/main/assets/index.html")
        if (!assetsFolder.exists()) {
            assetsFolder.mkdirs()
        }
        if (!indexHtml.exists()) {
            println("Notice: index.html not yet present in assets; ensuring web assets directory is ready.")
            indexHtml.text = "<!doctype html><html><head><meta charset='utf-8'><title>StudyMind</title></head><body><div id='root'></div></body></html>"
        }
        println("Verification passed: Web assets directory ready at: " + assetsFolder.absolutePath)
    }
}

tasks.matching { it.name.startsWith("assemble") || it.name.startsWith("bundle") }.configureEach {
    dependsOn 'checkWebAssets'
}
